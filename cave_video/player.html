<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Barlow Condensed'; src: url('assets/BarlowCondensed-Light.ttf'); font-weight: 300; }
@font-face { font-family: 'Barlow Condensed'; src: url('assets/BarlowCondensed-Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'Barlow Condensed'; src: url('assets/BarlowCondensed-SemiBold.ttf'); font-weight: 600; }
@font-face { font-family: 'JetBrains Mono'; src: url('assets/JetBrainsMono.ttf'); font-weight: 100 800; }
@font-face { font-family: 'IBM Plex Sans'; src: url('assets/IBMPlexSans.ttf'); font-weight: 100 700; }
html,body { margin:0; background:#000; }
canvas { display:block; width:540px; height:960px; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib/kz.js"></script>
<script src="lib/ab.js"></script>
<script src="lib/clips.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CUES = {};
window.setup = async () => {
  CUES = await (await fetch('cues.json')).json();
  window.CUES = CUES;   // scenes read neighbouring scenes' cues (camera moves that bridge a cut) and the reel clock
  const USE_CLIPS = false;   // no interview clips in this project; flip on to load clips/prepared/index.json
  if (USE_CLIPS) await CLIPS.load();
  await Promise.all(['300 40px "Barlow Condensed"', '500 40px "Barlow Condensed"', '600 40px "Barlow Condensed"',
    '500 40px "JetBrains Mono"', '600 40px "IBM Plex Sans"'].map(f => document.fonts.load(f)));
  AB.warm();   // bake grain / vignette / alarm textures once, before the first frame
  return Object.keys(CUES);
};
function placeholder(id, t, D) {
  const cam = AB.view(AB.V.FULL);
  AB.backdrop(ctx, cam, t);
  AB.label(ctx, `[${id}] not animated yet  t=${t.toFixed(2)}/${D}`, 80, 262, { size: 28 });
}
window.renderFrame = (id, t) => {
  const D = CUES[id].duration, cues = CUES[id].lines;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.clearRect(0, 0, AB.W, AB.H);
  const sc = KZ.scenes[id];
  ctx.save();
  if (sc) sc.draw(ctx, t, cues, D); else placeholder(id, t, D);
  ctx.restore();
  // burned-in caption layer, on top of every scene (a scene opts out with `captions: false`)
  if (!sc || sc.captions !== false) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    AB.captionLayer(ctx, t, id, cues);
  }
  ctx.restore();
};
window.grab = (type, q) => canvas.toDataURL(type, q);
window.sfxFor = id => {
  const sc = KZ.scenes[id];
  return sc && sc.sfx ? sc.sfx(CUES[id].lines, CUES[id].duration) : [];
};
</script></body></html>
