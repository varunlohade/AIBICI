<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Fredoka'; src: url('assets/Fredoka.ttf'); font-weight: 300 700; }
@font-face { font-family: 'Nunito'; src: url('assets/Nunito.ttf'); font-weight: 200 1000; }
html,body { margin:0; background:#000; }
canvas { display:block; width:540px; height:960px; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="lib/kz.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CUES = {};
window.setup = async () => {
  CUES = await (await fetch('cues.json')).json();
  await Promise.all(['300 40px Fredoka', '400 40px Fredoka', '500 40px Fredoka', '600 40px Fredoka', '700 40px Fredoka', '400 40px Nunito', '800 40px Nunito'].map(f => document.fonts.load(f)));
  return Object.keys(CUES);
};
function placeholder(id, t, D) {
  KZ.bg(ctx); KZ.stars(ctx, t);
  KZ.text(ctx, CUES[id].title, KZ.W / 2, 480, { size: 80 });
  KZ.text(ctx, `[${id}] scene not animated yet — t=${t.toFixed(2)}/${D}`, KZ.W / 2, 600, { size: 36, color: KZ.C.grey });
}
window.renderFrame = (id, t) => {
  const D = CUES[id].duration, cues = CUES[id].lines;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.clearRect(0, 0, KZ.W, KZ.H);
  const sc = KZ.scenes[id];
  if (sc) sc.draw(ctx, t, cues, D); else placeholder(id, t, D);
  ctx.restore();
};
window.grab = (type, q) => canvas.toDataURL(type, q);
window.sfxFor = id => {
  const sc = KZ.scenes[id];
  return sc && sc.sfx ? sc.sfx(CUES[id].lines, CUES[id].duration) : [];
};
</script></body></html>
